<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Tip Calculator | Split Bills Easily</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="background-decorations" aria-hidden="true">
    <div class="glow-orb glow-orb-1"></div>
    <div class="glow-orb glow-orb-2"></div>
  </div>

  <main class="calculator-wrapper">
    <header class="app-header">
      <h1 class="app-title">Tip Calculator</h1>
      <p class="app-subtitle">Calculate tips and split bills effortlessly in real-time</p>
    </header>

    <div class="calculator-card">
      <!-- Input Section -->
      <section class="calc-inputs" aria-label="Calculator Inputs">
        <!-- Currency selection & Bill Amount -->
        <div class="input-group">
          <div class="input-header">
            <label for="bill" class="input-label">Bill Amount</label>
            <div class="currency-picker-wrap">
              <label for="currency-select" class="sr-only">Currency</label>
              <select id="currency-select" class="currency-select" aria-label="Select currency">
                <option value="₹" selected>INR (₹)</option>
                <option value="$">USD ($)</option>
                <option value="€">EUR (€)</option>
                <option value="£">GBP (£)</option>
                <option value="¥">JPY (¥)</option>
                <option value="C$">CAD (C$)</option>
                <option value="A$">AUD (A$)</option>
              </select>
            </div>
          </div>
          <div class="input-control-wrap">
            <span class="input-icon" id="currency-symbol" aria-hidden="true">₹</span>
            <input type="number" id="bill" class="text-input" placeholder="0.00" min="0" step="any" inputmode="decimal"
              autocomplete="off">
          </div>
        </div>

        <!-- Tip Percentage Selection -->
        <fieldset class="input-group tip-section">
          <legend class="input-label">Select Tip %</legend>
          <div class="tip-grid" role="group" aria-label="Tip Percentage Options">
            <button type="button" class="tip-btn" data-tip="5">5%</button>
            <button type="button" class="tip-btn" data-tip="10">10%</button>
            <button type="button" class="tip-btn active" data-tip="15">15%</button>
            <button type="button" class="tip-btn" data-tip="20">20%</button>
            <button type="button" class="tip-btn" data-tip="25">25%</button>
            <div class="custom-tip-wrap">
              <label for="custom-tip" class="sr-only">Custom tip percentage</label>
              <input type="number" id="custom-tip" class="custom-tip-input" placeholder="Custom %" min="0" max="100"
                step="any" inputmode="decimal">
            </div>
          </div>
        </fieldset>

        <!-- Number of People -->
        <div class="input-group">
          <div class="input-header">
            <label for="people" class="input-label">Number of People</label>
            <span id="people-error" class="error-msg" aria-live="polite">Can't be zero</span>
          </div>
          <div class="input-control-wrap" id="people-wrap">
            <span class="input-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" />
                <circle cx="12" cy="7" r="4" />
              </svg>
            </span>
            <input type="number" id="people" class="text-input" value="1" min="1" step="1" inputmode="numeric"
              autocomplete="off">
          </div>
        </div>
      </section>

      <!-- Output / Results Section -->
      <section class="calc-results" aria-label="Calculation Summary">
        <div class="results-main">
          <!-- Tip Amount Per Person -->
          <div class="result-row">
            <div class="result-label-group">
              <span class="result-title">Tip Amount</span>
              <span class="result-subtitle">/ person</span>
            </div>
            <div class="result-value" id="tip-per-person" aria-live="polite">₹0.00</div>
          </div>

          <!-- Total Per Person -->
          <div class="result-row">
            <div class="result-label-group">
              <span class="result-title">Total</span>
              <span class="result-subtitle">/ person</span>
            </div>
            <div class="result-value highlight" id="total-per-person" aria-live="polite">₹0.00</div>
          </div>

          <!-- Divider -->
          <div class="result-divider"></div>

          <!-- Overall Summary Breakdown -->
          <div class="result-breakdown">
            <div class="breakdown-item">
              <span class="breakdown-label">Total Tip:</span>
              <span class="breakdown-value" id="total-tip">₹0.00</span>
            </div>
            <div class="breakdown-item">
              <span class="breakdown-label">Grand Total:</span>
              <span class="breakdown-value" id="grand-total">₹0.00</span>
            </div>
          </div>
        </div>

        <!-- Reset Button -->
        <button type="button" id="reset-btn" class="reset-button" disabled>
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
            <path d="M3 3v5h5" />
          </svg>
          RESET
        </button>
      </section>
    </div>

  </main>

  <script src="script.js"></script>
</body>

</html>
